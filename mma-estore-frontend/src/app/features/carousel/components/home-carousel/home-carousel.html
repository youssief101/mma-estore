<div
  class="carousel"
  *ngIf="slides.length > 0"
>

  <div class="slides">

    <div
      class="slide"
      *ngFor="let slide of slides; let i = index"
      [class.active]="i === currentIndex"
    >

      <img
        [src]="slide.image"
        [alt]="slide.title || 'Carousel image'"
      />

      <div
        class="overlay"
        *ngIf="slide.title || slide.subtitle"
      >

        <h2 *ngIf="slide.title">
          {{ slide.title }}
        </h2>

        <p *ngIf="slide.subtitle">
          {{ slide.subtitle }}
        </p>

        <a
          *ngIf="slide.buttonText"
          [href]="slide.buttonLink"
          class="button"
        >
          {{ slide.buttonText }}
        </a>

      </div>

    </div>

  </div>

  <button
    class="nav prev"
    (click)="previous()"
    aria-label="Previous slide"
  >
    &#10094;
  </button>

  <button
    class="nav next"
    (click)="next()"
    aria-label="Next slide"
  >
    &#10095;
  </button>

  <div class="dots">

    <button
      *ngFor="let slide of slides; let i = index"
      (click)="goTo(i)"
      [class.active]="i === currentIndex"
      aria-label="Go to slide"
    >
    </button>

  </div>

</div>
