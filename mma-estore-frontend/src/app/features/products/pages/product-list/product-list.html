<section class="products-page">

  <h1>Products</h1>

  <div class="filters">

    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchTerm"
    />

    <button
      type="button"
      (click)="searchProducts()"
    >
      Search
    </button>

    <select
      [(ngModel)]="selectedAudience"
      (change)="filterProducts()"
    >
      <option value="">
        All Audiences
      </option>

      <option value="Men">
        Men
      </option>

      <option value="Women">
        Women
      </option>

      <option value="Kids">
        Kids
      </option>

    </select>

    <button
      type="button"
      (click)="clearFilters()"
    >
      Reset
    </button>

  </div>

  @if (loading) {

    <p>Loading products...</p>

  } @else {

    <div class="products-grid">

      @for (product of products; track product._id) {

        <app-product-card
          [product]="product"
          (addToCart)="onAddToCart($event)"
        >
        </app-product-card>

      }

    </div>

  }

</section>
