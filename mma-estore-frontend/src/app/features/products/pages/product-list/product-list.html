<section class="products-page">

  <h1>Products</h1>

 <input
  [(ngModel)]="searchTerm"
  (keyup.enter)="searchProducts()"
  placeholder="Search..."
/>

  <button (click)="searchProducts()">
    Search
  </button>
  

  <div class="products-grid">

    @for (product of products; track product._id) {

      <app-product-card
        [product]="product">
      </app-product-card>

    }

  </div>

</section>
