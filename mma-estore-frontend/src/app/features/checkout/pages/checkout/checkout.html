<section class="checkout-page">

  <h1>Checkout</h1>

  <form
    [formGroup]="checkoutForm"
    (ngSubmit)="placeOrder()">

    <h2>Shipping Address</h2>

    <input
      type="text"
      placeholder="First Name"
      formControlName="firstName">

    <input
      type="text"
      placeholder="Last Name"
      formControlName="lastName">

    <input
      type="email"
      placeholder="Email"
      formControlName="email">

    <input
      type="text"
      placeholder="Phone"
      formControlName="phone">

    <input
      type="text"
      placeholder="Address"
      formControlName="address">

    <input
      type="text"
      placeholder="City"
      formControlName="city">

    <input
      type="text"
      placeholder="Country"
      formControlName="country">

    <input
      type="text"
      placeholder="Postal Code"
      formControlName="postalCode">

    <h2>Payment</h2>

    <label>

      <input
        type="radio"
        value="card"
        formControlName="paymentMethod">

      Credit Card

    </label>

    <label>

      <input
        type="radio"
        value="cash"
        formControlName="paymentMethod">

      Cash on Delivery

    </label>

    <button type="submit">

      Place Order

    </button>

  </form>

</section>
