<section class="checkout-page">
  <h1>Checkout</h1>

  <div class="checkout-container">
    <form class="checkout-form">
      <h2>Shipping Information</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" />
        </div>

        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="email" name="email" />
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" [(ngModel)]="phone" name="phone" />
        </div>
      </div>

      <div class="form-group">
        <label>Address *</label>
        <input type="text" [(ngModel)]="address" name="address" />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>City *</label>
          <input type="text" [(ngModel)]="city" name="city" />
        </div>

        <div class="form-group">
          <label>State</label>
          <input type="text" [(ngModel)]="state" name="state" />
        </div>

        <div class="form-group">
          <label>ZIP Code</label>
          <input type="text" [(ngModel)]="zipCode" name="zipCode" />
        </div>

        <div class="form-group">
          <label>Country *</label>
          <input type="text" [(ngModel)]="country" name="country" />
        </div>
      </div>

      <h2>Payment Method</h2>

      <div class="payment-options">
        <label>
          <input type="radio" value="card" [(ngModel)]="paymentMethod" name="paymentMethod" />
          Credit Card
        </label>

        <label>
          <input type="radio" value="paypal" [(ngModel)]="paymentMethod" name="paymentMethod" />
          PayPal
        </label>
      </div>
    </form>

    <aside class="order-summary">
      <h2>Order Summary</h2>

      @for (item of items; track item.product._id) {
        <div class="summary-item">
          <span>
            {{ item.product.name }}
            × {{ item.quantity }}
          </span>

          <span> ${{ item.product.price * item.quantity }} </span>
        </div>
      }

      <hr />

      <div class="summary-total">
        <strong> Total ({{ totalItems }} items) </strong>

        <strong> ${{ totalPrice }} </strong>
      </div>

      <button type="button" class="place-order-btn" (click)="placeOrder()">Place Order</button>
    </aside>
  </div>
</section>
