<hr>

<h2>Order Summary</h2>

<div class="summary">

  @for (item of cartItems; track item.product._id) {

    <div class="summary-row">

      <span>

        {{ item.product.name }}

        @if(item.selectedSize){

          ({{ item.selectedSize }})

        }

        × {{ item.quantity }}

      </span>

      <span>

        ${{ item.product.price * item.quantity }}

      </span>

    </div>

  }

  <hr>

  <div class="summary-row">

    <strong>Subtotal</strong>

    <strong>${{ subtotal }}</strong>

  </div>

  <div class="summary-row">

    <strong>Shipping</strong>

    <strong>FREE</strong>

  </div>

  <div class="summary-row total">

    <strong>Total</strong>

    <strong>${{ total }}</strong>

  </div>

</div>
