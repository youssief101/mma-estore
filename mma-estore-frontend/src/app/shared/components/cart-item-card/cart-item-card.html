<app-card>

    <div class="cart-item">

        <div class="image">

            <img

                [src]="item().image"

                [alt]="item().name">

        </div>

        <div class="details">

            <h3>

                {{item().name}}

            </h3>

            @if(item().fighter){

                <p>

                    {{item().fighter}}

                </p>

            }

            @if(item().size){

                <p>

                    Size:
                    <strong>

                        {{item().size}}

                    </strong>

                </p>

            }

            @if(item().color){

                <p>

                    Color:
                    <strong>

                        {{item().color}}

                    </strong>

                </p>

            }

            <div class="price">

                ${{item().price}}

            </div>

        </div>

        <div class="actions">

            <div class="quantity">

                <button

                    (click)="decrease.emit(item().id)"

                    [disabled]="item().quantity<=1">

                    −

                </button>

                <span>

                    {{item().quantity}}

                </span>

                <button

                    (click)="increase.emit(item().id)"

                    [disabled]="item().quantity>=item().stock">

                    +

                </button>

            </div>

            <div class="total">

                ${{total}}

            </div>

            <button

                class="remove"

                (click)="remove.emit(item().id)">

                Remove

            </button>

        </div>

    </div>

</app-card>
