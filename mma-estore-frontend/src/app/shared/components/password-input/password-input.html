<div class="password-wrapper">

    <input

        class="password-input"

        [type]="visible() ? 'text' : 'password'"

        [value]="value"

        [disabled]="disabled"

        autocomplete="current-password"

        (input)="updateValue($event)"

        (blur)="markTouched()">

    <button

        type="button"

        class="toggle-button"

        (click)="toggleVisibility()"

        [disabled]="disabled">

        <i
            class="bi"
            [class.bi-eye]="!visible()"
            [class.bi-eye-slash]="visible()">
        </i>

    </button>

</div>
